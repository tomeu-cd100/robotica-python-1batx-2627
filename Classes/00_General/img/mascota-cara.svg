<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="titol desc">
  <title id="titol">Esquema de blocs de la mascota T1</title>
  <desc id="desc">Carcassa de DM amb la matriu de LED com a cara, el servo de les orelles a la tapa, el PIR com a nas, la boca amb el brunzidor i el sensor de so, i el polsador al llom.</desc>
  <rect x="0" y="0" width="640" height="420" fill="#ffffff"/>

  <!-- Carcassa -->
  <rect x="130" y="60" width="380" height="300" rx="18" fill="#fdf6e3" stroke="#3a3a3a" stroke-width="3"/>
  <text x="320" y="40" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222">Carcassa DM 3 mm (mascota.svg)</text>

  <!-- Orelles / servo a la tapa -->
  <path d="M215 60 q10 -35 40 -10 z" fill="#f2c14e" stroke="#3a3a3a" stroke-width="2"/>
  <path d="M385 60 q10 -35 40 -10 z" fill="#f2c14e" stroke="#3a3a3a" stroke-width="2"/>
  <circle cx="320" cy="80" r="14" fill="#8ecae6" stroke="#3a3a3a" stroke-width="2"/>
  <text x="320" y="30" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">orelles (servo, P0)</text>

  <!-- Matriu LED = cara -->
  <g transform="translate(230,120)">
    <rect x="0" y="0" width="180" height="140" fill="#111" rx="8"/>
    <g fill="#ffb703">
      <circle cx="30" cy="30" r="6"/><circle cx="60" cy="30" r="6"/><circle cx="90" cy="30" r="6"/><circle cx="120" cy="30" r="6"/><circle cx="150" cy="30" r="6"/>
      <circle cx="30" cy="55" r="6"/><circle cx="150" cy="55" r="6"/>
      <circle cx="60" cy="70" r="6"/><circle cx="90" cy="70" r="6"/><circle cx="120" cy="70" r="6"/>
      <circle cx="30" cy="95" r="6"/><circle cx="150" cy="95" r="6"/>
      <circle cx="30" cy="120" r="6"/><circle cx="60" cy="120" r="6"/><circle cx="90" cy="120" r="6"/><circle cx="120" cy="120" r="6"/><circle cx="150" cy="120" r="6"/>
    </g>
  </g>
  <text x="320" y="280" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">matriu de LED integrada = cara (expressions)</text>

  <!-- PIR nas -->
  <rect x="295" y="292" width="50" height="24" fill="#adb5bd" stroke="#3a3a3a" stroke-width="2"/>
  <text x="320" y="330" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">PIR (nas, P8)</text>

  <!-- Boca: brunzidor + so -->
  <path d="M255 340 q65 30 130 0" fill="none" stroke="#3a3a3a" stroke-width="4" stroke-linecap="round"/>
  <text x="320" y="382" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">boca: brunzidor (P2) + micròfon (P4)</text>

  <!-- Polsador al llom -->
  <circle cx="150" cy="200" r="12" fill="#e63946" stroke="#3a3a3a" stroke-width="2"/>
  <text x="150" y="230" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">polsador</text>
  <text x="150" y="245" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">(carícia, P12)</text>

  <!-- micro:bit label -->
  <rect x="490" y="160" width="110" height="60" rx="6" fill="#e9ecef" stroke="#3a3a3a" stroke-width="2"/>
  <text x="545" y="185" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">micro:bit V2 +</text>
  <text x="545" y="202" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">Micro:shield</text>
</svg>
