<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="titol desc">
  <title id="titol">Esquema de blocs del rover T3 (vista de dalt)</title>
  <desc id="desc">El mateix xassís del vehicle T2, reaprofitat tal qual, amb dues peces d'ampliació noves: el suport de l'HC-SR04 al davant i el suport del seguidor de línia sota el xassís.</desc>
  <rect x="0" y="0" width="640" height="420" fill="#ffffff"/>
  <text x="320" y="30" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222">Rover = xassís del vehicle T2 + 2 peces d'ampliació</text>
  <text x="320" y="50" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555">(cap plantilla de tall làser nova)</text>

  <!-- Xassís reaprofitat -->
  <rect x="160" y="90" width="320" height="260" rx="16" fill="#e8f1f2" stroke="#3a3a3a" stroke-width="3" stroke-dasharray="0"/>
  <text x="320" y="365" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555">xassís, motors i roda boja reaprofitats de T2 (sense canvis)</text>

  <!-- Suport HC-SR04 (nou) al davant -->
  <rect x="280" y="70" width="80" height="30" rx="6" fill="#f4a261" stroke="#3a3a3a" stroke-width="2.5"/>
  <text x="320" y="63" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333">NOU: suport HC-SR04</text>

  <!-- Motoreductors laterals (reaprofitats) -->
  <rect x="90" y="190" width="70" height="110" rx="8" fill="#f2c14e" stroke="#3a3a3a" stroke-width="2"/>
  <text x="125" y="320" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">motor esq. (M1)</text>

  <rect x="480" y="190" width="70" height="110" rx="8" fill="#f2c14e" stroke="#3a3a3a" stroke-width="2"/>
  <text x="515" y="320" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">motor dret (M2)</text>

  <!-- Bloc central: micro:bit + shield + portapiles (reaprofitat) -->
  <rect x="230" y="170" width="180" height="120" rx="10" fill="#e9ecef" stroke="#3a3a3a" stroke-width="2"/>
  <text x="320" y="220" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">micro:bit V2 +</text>
  <text x="320" y="238" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">Micro:shield</text>
  <text x="320" y="262" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555">portapiles 4×AA</text>

  <!-- Suport seguidor de línia (nou), sota el xassís -->
  <rect x="270" y="330" width="100" height="24" rx="6" fill="#f4a261" stroke="#3a3a3a" stroke-width="2.5"/>
  <text x="320" y="347" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#333">NOU: seguidor</text>
  <text x="320" y="400" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">suport del seguidor de línia (sota el xassís, mirant a terra)</text>
</svg>
